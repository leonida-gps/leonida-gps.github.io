:root{color-scheme:dark;--night:#160a30;--magenta:#ff2e93;--sunset:#ff8a3d;--gold:#ffc85c;--aqua:#3be3e0;--ink:#fff1fb;--haze:#bfaae6}
html,body{margin:0;min-height:100%;background:#160a30;color:var(--ink);font-family:"Overpass Variable",Overpass,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.ls{position:fixed;inset:0;z-index:100;overflow:auto;display:grid;place-items:center;padding:28px 16px;isolation:isolate}
.ls[hidden]{display:none}
.ls-sky{position:fixed;inset:0;z-index:-5;background:linear-gradient(180deg,#12052b 0%,#2c0b52 26%,#7a1468 47%,#e3337a 59%,#ff8a3d 66%,#ffc36b 68.5%,#2a0a3f 68.6%,#16062a 82%,#0c0318 100%)}
.ls-sun{position:fixed;left:50%;top:68.5%;width:min(70vw,620px);aspect-ratio:1;translate:-50% -50%;z-index:-4;border-radius:50%;background:radial-gradient(circle,rgba(255,214,140,.95) 0%,rgba(255,138,61,.75) 22%,rgba(255,46,147,.35) 45%,transparent 68%);clip-path:inset(0 0 50% 0)}
.ls-sea{position:fixed;left:0;right:0;top:68.6%;bottom:0;z-index:-3;background:repeating-linear-gradient(180deg,rgba(255,170,120,.10) 0 2px,transparent 2px 9px);mask-image:radial-gradient(60% 70% at 50% 0%,#000 0%,transparent 75%);-webkit-mask-image:radial-gradient(60% 70% at 50% 0%,#000 0%,transparent 75%)}
.ls-palm{position:fixed;bottom:-2vh;z-index:-2;height:min(78vh,720px);width:auto;fill:#0e0319}
.ls-palm-l{left:-3vw}
.ls-palm-r{right:-5vw;transform:scaleX(-1);height:min(64vh,600px)}
.ls-grain{position:fixed;inset:0;z-index:-1;opacity:.13;mix-blend-mode:overlay;pointer-events:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.ls-wrap{width:min(92vw,450px);display:flex;flex-direction:column;align-items:center;gap:14px}
.ls-sign{width:100%;padding:8px;border-radius:20px;background:linear-gradient(160deg,#1b1a5c 0%,#1a0f4d 55%,#2a0d55 100%);box-shadow:0 30px 70px -25px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.06) inset}
.ls-sign-in{border:3px solid #fff7fd;border-radius:14px;padding:22px 22px 18px;text-align:center}
.ls-hello{margin:0;font-weight:800;font-size:15px;letter-spacing:.02em;color:#fff}
.ls-neon{margin:4px 0 2px;font-family:"Neonderthaw",cursive;font-weight:400;font-size:clamp(76px,22vw,112px);line-height:.95;color:#ffe3f3;text-shadow:0 0 6px #ff79bd,0 0 16px #ff2e93,0 0 34px rgba(255,46,147,.8),0 0 60px rgba(255,46,147,.45)}
.ls-tag{margin:0 0 18px;font-size:14px;color:#e9dcff}
.ls-tag b{display:inline-block;border:2px solid #fff;border-radius:6px;padding:2px 6px 0;font-weight:900;color:#fff;margin-right:4px}
#ls-form{display:flex;flex-direction:column;gap:10px;text-align:left}
#ls-form label{font-size:13px;font-weight:700;color:#e9dcff}
.ls-field{display:flex;gap:8px}
#ls-pw{flex:1;min-width:0;height:48px;border-radius:11px;border:2px solid transparent;background:#fff7fd;color:#1a0b38;font:600 16px "Overpass Variable",system-ui,sans-serif;padding:0 14px}
#ls-pw:focus{outline:none;border-color:var(--aqua)}
#ls-eye{height:48px;padding:0 14px;border-radius:11px;border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;font:700 13px "Overpass Variable",system-ui,sans-serif;cursor:pointer}
.ls-check{display:flex;align-items:center;gap:8px;font-weight:600!important}
.ls-check input{width:17px;height:17px;accent-color:#ff2e93}

<script>
(() => {
  // Aquí abro la app: derivo la llave de tu contraseña, descifro y monto todo en el navegador
  const P = JSON.parse(document.getElementById('payload').textContent);
  const $ = (id) => document.getElementById(id);
  const form = $('ls-form'), pw = $('ls-pw'), msg = $('ls-msg'), go = $('ls-go'), sign = $('ls-sign'), eye = $('ls-eye'), remember = $('ls-remember');
  const ls = document.querySelector('.ls');
  const b64 = (s) => { const t = atob(s), u = new Uint8Array(t.length); for (let i = 0; i < t.length; i++) u[i] = t.charCodeAt(i); return u; };
  const toB64 = (u) => { let s = ''; u.forEach((b) => (s += String.fromCharCode(b))); return btoa(s); };
  const KEY = 'leonida-gps-v1';
  const store = {
    get() { try { return localStorage.getItem(KEY); } catch (e) { return null; } },
    set(v) { try { localStorage.setItem(KEY, v); } catch (e) {} },
    del() { try { localStorage.removeItem(KEY); } catch (e) {} },
  };
  const ok = !!(window.crypto && crypto.subtle && window.DecompressionStream);
  if (!ok) { msg.textContent = 'Tu navegador no soporta el cifrado de esta página. Ábrela en Chrome, Edge, Safari o Firefox actualizados.'; go.disabled = true; }

  async function unwrap(password) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password.normalize('NFC')), 'PBKDF2', false, ['deriveKey']);
    const kek = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(P.salt), iterations: P.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    for (const w of P.wraps) {
      try { return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(w.iv) }, kek, b64(w.ct))); } catch (e) { /* sigo con la otra variante */ }
    }
    return null;
  }
  async function open(raw) {
    const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    const zipped = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, key, b64(P.ct));
    const text = await new Response(new Blob([zipped]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    return JSON.parse(text);
  }
  function inject(app, viaBlob) {
    const s = document.createElement('script');
    s.type = 'module';
    if (viaBlob) s.src = URL.createObjectURL(new Blob([app.js], { type: 'text/javascript' }));
    else s.textContent = app.js;
    document.body.appendChild(s);
  }
  function mount(app) {
    if (!$('app-css')) { const st = document.createElement('style'); st.id = 'app-css'; st.textContent = app.css; document.head.appendChild(st); }
    // El candado se queda con "Abriendo…" hasta que la app ya pintó; así nunca se ve una pantalla vacía
    let shown = false;
    const show = () => { if (shown) return; shown = true; ls.hidden = true; document.body.classList.add('is-open'); msg.textContent = ''; go.disabled = false; };
    window.__leonidaReady = show;
    go.disabled = true;
    msg.textContent = 'Abriendo…';
    window.__leonidaBoot = 0;
    inject(app, false);
    // Si el visor bloquea el script en línea, pruebo otra vía y si no, aviso claro
    setTimeout(() => {
      if (window.__leonidaBoot) { setTimeout(show, 6000); return; } // arrancó; si no me avisa, igual quito el candado
      try { inject(app, true); } catch (e) { /* sin plan B */ }
      setTimeout(() => {
        if (window.__leonidaBoot) { setTimeout(show, 6000); return; }
        document.body.classList.remove('is-open');
        ls.hidden = false;
        msg.textContent = 'Este visor no dejó arrancar la app. Ábrela en una pestaña nueva o en otro navegador.';
      }, 3000);
    }, 3500);
  }
  window.__leonidaLock = () => {
    store.del();
    $('root').replaceChildren();
    document.body.classList.remove('is-open');
    ls.hidden = false;
    pw.value = '';
    msg.textContent = 'Leonida quedó bloqueada en este dispositivo.';
    pw.focus();
  };
  eye.addEventListener('click', () => {
    const show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    eye.textContent = show ? 'Ocultar' : 'Mostrar';
    eye.setAttribute('aria-pressed', String(show));
  });
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!ok) return;
    go.disabled = true;
    msg.textContent = 'Abriendo…';
    try {
      const raw = await unwrap(pw.value.trim());
      if (!raw) {
        msg.textContent = 'Contraseña incorrecta. Revisa mayúsculas, números y la @.';
        sign.classList.remove('bad'); void sign.offsetWidth; sign.classList.add('bad');
        go.disabled = false;
        return;
      }
      if (remember.checked) store.set(toB64(raw));
      mount(await open(raw));
    } catch (err) {
      msg.textContent = 'No se pudo abrir la app. Recarga la página e inténtalo otra vez.';
      go.disabled = false;
    }
  });
  const saved = ok && store.get();
  if (saved) {
    msg.textContent = 'Abriendo…';
    open(b64(saved)).then(mount).catch(() => { store.del(); msg.textContent = ''; });
  } else {
    pw.focus();
  }
})();
</script>
</body>
</html>
